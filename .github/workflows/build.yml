name: Build Gym Tracker iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: GymTracker_iOS/GymTracker
        run: xcodegen generate

      - name: Build unsigned iOS app
        working-directory: GymTracker_iOS/GymTracker
        run: |
          xcodebuild \
            -project GymTracker.xcodeproj \
            -scheme GymTracker \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Inspect app bundle
        run: |
          set -e

          APP_PATH=$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
            -type d \
            -path "*/Release-iphoneos/*.app" \
            | head -n 1)

          echo "===== APP PATH ====="
          echo "$APP_PATH"

          echo ""
          echo "===== INFO PLIST ====="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"

          echo ""
          echo "===== EXECUTABLE ====="
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
          file "$APP_PATH/$EXECUTABLE"

          echo ""
          echo "===== APP CONTENT ====="
          find "$APP_PATH" -maxdepth 2 -type f -print
     
      - name: Verify built app
        run: |
          set -e

          APP_PATH=$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
            -type d \
            -path "*/Release-iphoneos/*.app" \
            | head -n 1)

          echo "APP TROVATA:"
          echo "$APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERRORE: .app non trovata"
            find "$GITHUB_WORKSPACE/build/DerivedData" -type d -name "*.app"
            exit 1
          fi

          echo "CONTENUTO APP:"
          find "$APP_PATH" -maxdepth 2 -print

          test -f "$APP_PATH/Info.plist"

          echo "Info.plist trovata."

      - name: Create standard IPA
        run: |
          set -e

          APP_PATH=$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
            -type d \
            -path "*/Release-iphoneos/*.app" \
            | head -n 1)

          rm -rf "$GITHUB_WORKSPACE/build/IPA"
          mkdir -p "$GITHUB_WORKSPACE/build/IPA/Payload"

          APP_NAME=$(basename "$APP_PATH")

          cp -R "$APP_PATH" \
            "$GITHUB_WORKSPACE/build/IPA/Payload/$APP_NAME"

          cd "$GITHUB_WORKSPACE/build/IPA"

          zip -r -X GymTracker.ipa Payload

          echo ""
          echo "===== CONTENUTO IPA ====="
          unzip -l GymTracker.ipa

          echo ""
          echo "===== DIMENSIONE IPA ====="
          ls -lh GymTracker.ipa

          echo ""
          echo "===== CONTROLLO STRUTTURA ====="
          test -d "Payload/$APP_NAME"
          test -f "Payload/$APP_NAME/Info.plist"

          echo "IPA VALIDA COME ARCHIVIO."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GymTracker-IPA
          path: build/IPA/GymTracker.ipa
