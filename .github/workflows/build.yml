name: Build Gym Tracker iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: GymTracker_iOS/GymTracker
        run: xcodegen generate

      - name: Build unsigned iOS app
        working-directory: GymTracker_iOS/GymTracker
        run: |
          xcodebuild \
            -project GymTracker.xcodeproj \
            -scheme GymTracker \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          echo "Cerco l'app compilata..."

          APP_PATH=$(find "$GITHUB_WORKSPACE/build/DerivedData" \
            -type d \
            -name "*.app" \
            | head -n 1)

          echo "APP TROVATA:"
          echo "$APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERRORE: non trovo il file .app"
            find "$GITHUB_WORKSPACE/build/DerivedData" -maxdepth 8 -type d
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/build/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/build/Payload/"

          cd "$GITHUB_WORKSPACE/build"
          zip -qry GymTracker.ipa Payload

          echo "IPA CREATA:"
          ls -lh GymTracker.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GymTracker-IPA
          path: build/GymTracker.ipa
