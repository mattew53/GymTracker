name: Build Gym Tracker iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: GymTracker_iOS/GymTracker
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: GymTracker_iOS/GymTracker
        run: |
          set -e

          xcodebuild \
            -project GymTracker.xcodeproj \
            -scheme GymTracker \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Locate app
        id: locate
        run: |
          set -e

          APP_PATH=$(find \
            "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
            -type d \
            -path "*/Release-iphoneos/*.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERRORE: .app non trovata"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_OUTPUT"

          echo "===== APP ====="
          echo "$APP_PATH"

      - name: Verify app bundle
        run: |
          set -e

          APP_PATH="${{ steps.locate.outputs.APP_PATH }}"

          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"

          echo "===== INFO PLIST ====="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundlePackageType" \
            "$APP_PATH/Info.plist"

          echo "===== EXECUTABLE ====="

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP_PATH/Info.plist"
          )

          test -f "$APP_PATH/$EXECUTABLE"

          file "$APP_PATH/$EXECUTABLE"

          echo "===== APP CONTENT ====="
          find "$APP_PATH" -maxdepth 2 -print

      - name: Create IPA
        run: |
          set -e

          APP_PATH="${{ steps.locate.outputs.APP_PATH }}"

          rm -rf "$GITHUB_WORKSPACE/build/Payload"
          rm -rf "$GITHUB_WORKSPACE/build/IPA"

          mkdir -p "$GITHUB_WORKSPACE/build/Payload"
          mkdir -p "$GITHUB_WORKSPACE/build/IPA"

          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/build/Payload/"

          cd "$GITHUB_WORKSPACE/build"

          /usr/bin/zip \
            -r \
            -X \
            "$GITHUB_WORKSPACE/build/IPA/GymTracker.ipa" \
            Payload

          echo "===== IPA CONTENT ====="

          /usr/bin/unzip -l \
            "$GITHUB_WORKSPACE/build/IPA/GymTracker.ipa"

          echo "===== IPA TEST ====="

          /usr/bin/unzip -t \
            "$GITHUB_WORKSPACE/build/IPA/GymTracker.ipa"

          echo "===== IPA SIZE ====="

          ls -lh "$GITHUB_WORKSPACE/build/IPA/GymTracker.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GymTracker-IPA
          path: build/IPA/GymTracker.ipa
          if-no-files-found: error
