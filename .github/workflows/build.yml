name: Build Gym Tracker iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: GymTracker_iOS/GymTracker
        run: xcodegen generate

      - name: Build unsigned iOS app
        working-directory: GymTracker_iOS/GymTracker
        run: |
          xcodebuild \
            -project GymTracker.xcodeproj \
            -scheme GymTracker \
            -sdk iphoneos \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH="GymTracker_iOS/GymTracker/build/Release-iphoneos/Gym Tracker.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="GymTracker_iOS/GymTracker/build/Build/Products/Release-iphoneos/Gym Tracker.app"
          fi
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry GymTracker.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GymTracker-IPA
          path: build/GymTracker.ipa
