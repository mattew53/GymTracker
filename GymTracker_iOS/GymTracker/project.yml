name: GymTracker

options:
  bundleIdPrefix: com.gymtracker
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.gymtracker.personal
    PRODUCT_NAME: Gym Tracker
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Gym Tracker
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.health-and-fitness
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  GymTracker:
    type: application
    platform: iOS
    sources:
      - path: GymTrackerApp.swift
      - path: Resources
        buildPhase: resources
    settings:
      base:
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
