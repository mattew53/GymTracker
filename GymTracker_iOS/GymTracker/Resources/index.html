/* V9 visual corrections — user supplied anatomy assets */
.workout-shell{padding-bottom:108px!important}

.muscle-tab{font-weight:850!important;box-shadow:inset 0 1px #ffffff08}
.rich-exercise{min-height:82px!important;padding:9px 5px!important}
.exercise-thumb{flex:0 0 64px!important}
.exercise-thumb{

function muscleIcon(g){let s=(g||'').toLowerCase();if(s.includes('petto'))return '◉';if(s.includes('schiena'))return '▰';if(s.includes('spall'))return '◆';if(s.includes('bicip'))return '◌';if(s.includes('tricip'))return '◇';if(s.includes('gamb')||s.includes('quad')||s.includes('femor')||s.includes('polp'))return '◒';return '◈'}
function monthLabel(){let d=new Date();return d.toLocaleDateString('it-IT',{month:'long',year:'numeric'})}
function nav(active){return `<nav class="bottomnav"><button class="navitem ${active==='home'?'active':''}" data-nav="home"><span>⌂</span><span>Home</span></button><button class="navitem ${active==='calendar'?'active':''}" data-nav="calendar"><span>▦</span><span>Calendario</span></button><button class="navitem ${active==='progress'?'active':''}" data-nav="progress"><span>▥</span><span>Progressi</span></button><button class="navitem ${active==='more'?'active':''}" data-nav="more"><span>•••</span><span>Altro</span></button></nav>`}
function bindNav(){app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{let x=b.dataset.nav;if(x==='home')renderHome();if(x==='calendar')renderCalendarPage();if(x==='progress')renderProgress();if(x==='more')renderMore()})}
function renderHome(){let n=state.history.length,k=dateKey(),a=state.activities[k],sets=state.history.reduce((q,w)=>q+w.sets.length,0),upper=state.history.filter(w=>w.type==='Upper').length,lower=state.history.filter(w=>w.type==='Lower').length;let pct=a?Math.min(100,Math.round(Number(a.steps||0)/10000*100)):0;app.innerHTML=`<section class="hero"><div class="hero-head"><div class="topbar"><div><div class="eyebrow">GYM TRACKER · ${nice(k)}</div><h1>Ciao Matteo! 💪</h1><div class="sub">Pronto per allenarti oggi?</div></div><button class="iconbtn" id="settings">⚙</button></div></div><div class="split-card" id="upper"><div class="figure">${svgBody('upper')}</div><div class="eyebrow" style="color:#d7f1ff">SCHEDA A</div><div class="label">UPPER</div><div class="desc">Petto · Schiena · Spalle · Braccia</div><div class="arrow">›</div></div><div class="split-card lower" id="lower"><div class="figure">${svgBody('lower')}</div><div class="eyebrow" style="color:#d7fff4">SCHEDA B</div><div class="label">LOWER</div><div class="desc">Gambe · Glutei · Polpacci · Lombari</div><div class="arrow">›</div></div><div class="section-title"><b>Ultimi allenamenti</b><span class="link" id="allhist">Vedi tutti</span></div><div class="list-card">${state.history.slice(-3).reverse().map(w=>`<div class="recent"><div class="mini-icon">${w.type==='Upper'?'◒':'◓'}</div><div class="meta"><b>${w.type}</b><div class="muted">${w.date} · ${w.sets.length} serie</div></div><div class="check">✓</div></div>`).join('')||'<div class="empty">Nessun allenamento registrato.</div>'}</div><div class="section-title"><b>Attività di oggi</b><span class="link" id="activity">Apri</span></div><div class="card activity-card">${a?`<div class="stat"><span>🚶 Passi</span><b>${Number(a.steps||0).toLocaleString('it-IT')} / 10.000</b></div><div class="activity-progress"><i style="width:${pct}%"></i></div><div class="stat"><span>🎯 Obiettivo</span><b>${a.goal?'Raggiunto':'In corso'}</b></div>${a.cardioType?`<div class="section-divider"></div><div class="stat"><span>🔥 ${esc(a.cardioType)}</span><b>${a.minutes} min · ~${a.calories} kcal</b></div>`:''}`:'<div class="stat"><span>🚶 Passi</span><b>Nessun dato</b></div><div class="muted" style="margin-top:7px">Registra passi e cardio della giornata.</div>'}</div><div class="section-title"><b>Riepilogo</b><span class="link" id="stats">Statistiche</span></div><div class="quick-grid"><div class="quick"><div class="l">ALLENAMENTI</div><div class="v">${n}</div></div><div class="quick"><div class="l">SERIE</div><div class="v">${sets}</div></div><div class="quick"><div class="l">U / L</div><div class="v">${upper} / ${lower}</div></div></div></section>${nav('home')}`;app.querySelector('#upper').onclick=()=>startWorkout('Upper');app.querySelector('#lower').onclick=()=>startWorkout('Lower');app.querySelector('#allhist').onclick=renderHistory;app.querySelector('#activity').onclick=renderActivity;app.querySelector('#stats').onclick=renderStats;app.querySelector('#settings').onclick=renderSettings;bindNav()}
function startWorkout(t){state.type=t;state.opened={};state.selectedGroup=null;if(!state.draft||typeof state.draft!=='object')state.draft={};save();renderWork()}
function renderCalendarPage(){let d=new Date(),y=d.getFullYear(),m=d.getMonth();let off=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();let names=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];let monthKey=y+'-'+String(m+1).padStart(2,'0');let monthHist=state.history.filter(w=>w.key.startsWith(monthKey));let up=monthHist.filter(w=>w.type==='Upper').length,lo=monthHist.filter(w=>w.type==='Lower').length;let h=`<div class="topbar"><button class="iconbtn" id="back">‹</button><h2>Calendario</h2><button class="iconbtn">•••</button></div><div class="card" style="margin-top:13px"><div class="month-head"><button class="iconbtn" style="width:34px;height:34px;min-height:34px">‹</button><b>${d.toLocaleDateString('it-IT',{month:'long',year:'numeric'})}</b><button class="iconbtn" style="width:34px;height:34px;min-height:34px">›</button></div><div class="calendar">`+names.map(x=>`<div class="calhead">${x}</div>`).join('');for(let i=0;i<off;i++)h+='<div></div>';for(let i=1;i<=days;i++){let k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(i).padStart(2,'0'),w=state.history.find(x=>x.key===k),today=k===dateKey();h+=`<button class="day ${w?'work':''} ${today?'today':''}" ${w?`data-day="${k}"`:''}>${i}${w?`<small>${w.type}</small>`:''}</button>`}h+=`</div><div class="legend"><span><i style="background:#168cff"></i>Upper</span><span><i style="background:#13e5d0"></i>Lower</span><span><i style="border:1px solid #fff"></i>Oggi</span></div></div><div class="section-title"><b>Riepilogo mese</b></div><div class="calendar-summary"><div class="metric"><div class="stat-label">ALLENAMENTI</div><div class="value">${monthHist.length}</div></div><div class="metric"><div class="stat-label">UPPER</div><div class="value">${up}</div></div><div class="metric"><div class="stat-label">LOWER</div><div class="value">${lo}</div></div></div><div class="section-title"><b>Attività</b></div><div class="card"><div class="stat"><span>Giorni allenati</span><b>${monthHist.length} / ${days}</b></div><div class="stat"><span>Serie registrate</span><b>${monthHist.reduce((q,w)=>q+w.sets.length,0)}</b></div></div>${nav('calendar')}`;app.innerHTML=h;app.querySelector('#back').onclick=renderHome;app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>renderDay(b.dataset.day));bindNav()}

function exerciseMuscleKey(name){
  let n=(name||'').toLowerCase();
  // Biceps first: "Panca Scott / Preacher Curl" must never match "panca" as chest.
  if(n.includes('bicip')||n.includes('hammer')||n.includes('preacher')||n.includes('scott')||n.includes('curl')) return 'biceps';
  if(n.includes('reverse fly')) return 'shoulders';
  if(n.includes('shoulder')||n.includes('military')||n.includes('alzate')) return 'shoulders';
  if(n.includes('chest')||n.includes('pec')||n.includes('panca')||n.includes('croci')) return 'chest';
  if(n.includes('t-bar')||n.includes('pulley')||n.includes('lat ')||n.includes('row')) return 'back';
  if(n.includes('tricip')||n.includes('push down')||n.includes('pushdown')||n.includes('overhead extension')) return 'triceps';
  return null;
}
function lowerMuscleKey(name){
  let n=(name||'').toLowerCase();
  if(n.includes('hip thrust')||n.includes('abductor')) return 'glutes';
  if(n.includes('adductor')) return 'quads';
  if(n.includes('leg curl')||n.includes('femoral')) return 'quads';
  if(n.includes('leg extension')||n.includes('leg press')||n.includes('hack squat')) return 'quads';
  if(n.includes('calf')) return 'calves';
  if(n.includes('hyperextension')||n.includes('lower back')||n.includes('lomb')) return 'lumbar';
  if(n.includes('reverse grip curl')) return 'glutes';
  return 'quads';
}
function exerciseArt(name,type){
  let key=type==='Lower'?lowerMuscleKey(name):exerciseMuscleKey(name);
  let src=key?muscleArt[key]:null;
  let c=type==='Lower'?'#19d99a':'#168dff';
  if(!src) return `<div class="exercise-symbol" style="display:grid!important;place-items:center;width:100%;height:100%;color:${c};font-size:27px;font-weight:900">•</div>`;
  return `<img class="muscle-art" src="${src}" alt="${esc(name)}">`;
}
function renderWork(){let gs=groups(state.type);let keys=Object.keys(gs);let selected=state.selectedGroup&&gs[state.selectedGroup]?state.selectedGroup:keys[0];state.selectedGroup=selected;let exs=gs[selected]||[];let total=Object.values(state.draft).flat().length;let typeColor=state.type==='Lower'?'#12dfad':'#168cff';let lastFor=e=>{let arr=state.history.flatMap(w=>w.type===state.type?w.sets:[]).filter(s=>s.exercise===e);return arr.length?`${arr[arr.length-1].kg} kg × ${arr[arr.length-1].reps} · ${arr[arr.length-1].rir} RIR`:'Nessuna registrazione'};let h=`<div class="workout-shell"><div class="topbar"><button class="iconbtn" id="back">‹</button><div style="flex:1"><div class="eyebrow">ALLENAMENTO · ${nice(dateKey())}</div><h2>${state.type}</h2></div><button class="iconbtn" id="timerToggle">⏱</button></div><div class="workout-cover ${state.type==='Lower'?'lower':''}" style="border-color:${typeColor}"><div class="cover-art">${svgBody(state.type==='Upper'?'upper':'lower')}</div><div class="eyebrow" style="color:#ffffffaa">SCHEDA ${state.type==='Upper'?'A':'B'}</div><h1>${state.type}</h1><div class="cover-sub">${state.type==='Upper'?'Petto · Schiena · Spalle · Bicipiti · Tricipiti':'Quadricipiti · Femorali · Glutei · Polpacci · Lombari'}</div><div class="cover-bottom"><span class="cover-pill">${keys.length} gruppi</span><span class="cover-pill">${total} serie registrate</span><span class="cover-pill">${nice(dateKey())}</span></div></div><div class="workout-tabs"><button id="up" class="${state.type==='Upper'?'active':''}">UPPER</button><button id="low" class="${state.type==='Lower'?'active':''}">LOWER</button></div><div class="section-title" style="margin-top:13px"><b>Gruppi muscolari</b><span class="muted">${exs.length} esercizi</span></div><div class="muscle-tabs">${keys.map(g=>`<button class="muscle-tab ${g===selected?'active':''} ${state.type==='Lower'&&g===selected?'lower-active':''}" data-muscle="${esc(g)}">${muscleIcon(g)} ${esc(g)}</button>`).join('')}</div><div class="exercise-list-card"><div class="exercise-list-head"><b>${muscleIcon(selected)} ${esc(selected)}</b><span>${exs.length} esercizi · seleziona per aprire</span></div>${exs.map((e,i)=>{let k=state.type+'|'+e,s=state.draft[k]||[];return `<button class="rich-exercise" data-ex="${esc(e)}" style="width:100%;text-align:left;background:transparent;border:0;border-radius:0;min-height:76px"><div class="exercise-thumb">${exerciseArt(e,state.type)}</div><div style="min-width:0;flex:1"><h3>${esc(e)}</h3><div class="subline">${i+1} · ${selected} · ${s.length?`${s.length} serie nella sessione`:'non ancora registrato'}</div><div class="last-mini">${esc(lastFor(e))}</div></div><div class="go">›</div></button>`}).join('')}</div><div class="card" style="margin-top:11px"><div class="stat"><div><div class="stat-label">SESSIONE DI OGGI</div><b style="font-size:15px">${state.type} · ${total} serie</b></div><div class="number" style="color:${typeColor}">${new Set(Object.values(state.draft).flat().map(x=>x.exercise)).size}</div></div><div class="muted" style="margin-top:5px">Tocca un esercizio per inserire e modificare le serie.</div></div><div class="session-footer"><button id="finish" class="primary primary-full" ${total?'':'disabled'}>✓ Termina allenamento · ${total} serie</button></div></div>`;app.innerHTML=h;app.querySelector('#back').onclick=renderHome;app.querySelector('#up').onclick=()=>startWorkout('Upper');app.querySelector('#low').onclick=()=>startWorkout('Lower');app.querySelector('#timerToggle').onclick=renderTimer;app.querySelectorAll('[data-muscle]').forEach(b=>b.onclick=()=>{state.selectedGroup=b.dataset.muscle;renderWork()});app.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>renderExerciseDetail(b.dataset.ex));app.querySelector('#finish').onclick=()=>{let sets=Object.values(state.draft).flat();if(!sets.length)return;let k=dateKey();state.history.push({key:k,date:nice(k),type:state.type,sets});state.draft={};state.selectedGroup=null;save();renderHome()}}
function renderTimer(){let selected=state.selected||180;app.innerHTML=`<div class="topbar"><button class="iconbtn" id="back">‹</button><h2>Timer</h2><button class="iconbtn">⚙</button></div><div class="card timer-card"><div class="muted">RECUPERO</div><div class="timer-ring"><div class="timer-inner"><strong id="timer">${fmt(state.timer||selected)}</strong><span>Riposo</span></div></div><div class="timer-controls"><div><button class="iconbtn" id="reset">↻</button><div class="muted">Reset</div></div><button class="play" id="start">▶</button><div><button class="iconbtn" id="stop">■</button><div class="muted">Stop</div></div></div><div class="preset">${[30,60,90,120,180,300].map(x=>`<button data-p="${x}" class="${selected===x?'active':''}">${x>=60?x/60+'m':x+'s'}</button>`).join('')}</div></div>`;const el=app.querySelector('#timer');const update=()=>el.textContent=fmt(state.timer);const start=()=>{clearInterval(timerId);if(!state.timer)state.timer=selected;timerId=setInterval(()=>{state.timer--;update();if(state.timer<=0)clearInterval(timerId)},1000)};app.querySelector('#back').onclick=()=>{clearInterval(timerId);renderWork()};app.querySelector('#start').onclick=start;app.querySelector('#stop').onclick=()=>clearInterval(timerId);app.querySelector('#reset').onclick=()=>{clearInterval(timerId);state.timer=selected;update()};app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.p);state.selected=selected;state.timer=selected;update();start()})}

function periodStartKey(mode){

  const now=new Date();
  if(mode==='week'){
    const d=new Date(now); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); d.setHours(0,0,0,0);
    return list.filter(w=>w.key>=dateKey(d));
  }
  if(mode==='month'){
    const prefix=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    return list.filter(w=>w.key.startsWith(prefix));
  }
  if(mode==='year') return list.filter(w=>w.key.startsWith(String(now.getFullYear())+'-'));
  return list.filter(w=>w.key>=periodStartKey(mode));
}
function renderProgress(){
  let all=[...Object.values(built.Upper).flat(),...Object.values(built.Lower).flat(),...Object.values(state.custom.Upper).flat(),...Object.values(state.custom.Lower).flat()];
  let ex=state.progressEx||all[0]||'Chest Press';
  let period=state.progressPeriod||'3M';
  let rows=[];
  state.history.forEach(w=>{if(w.key>=periodStartKey(period))w.sets.filter(s=>s.exercise===ex).forEach(s=>rows.push({...s,date:w.date,key:w.key}))});
  let max=Math.max(1,...rows.map(x=>Number(x.kg)||0));
  let vol=rows.reduce((q,r)=>q+(Number(r.kg)||0)*(Number(r.reps)||0),0);
  let best=rows.length?Math.max(...rows.map(r=>Number(r.kg)||0)):0;
  let pts=rows.length?rows.slice(-8).map((r,i)=>`${i*14+3},${95-((Number(r.kg)||0)/max)*75}`).join(' '):'3,90 18,80 33,70 48,65 63,55 78,45 93,30';
  app.innerHTML=`<div class="topbar"><div><div class="eyebrow">PROGRESSI</div><h2>${esc(ex)}</h2></div><button class="iconbtn">•••</button></div>
  <select id="ex" class="field" style="margin-top:13px">${[...new Set(all)].map(x=>`<option ${x===ex?'selected':''}>${esc(x)}</option>`).join('')}</select>
  <div class="seg" style="margin-top:9px"><button data-period="1M" class="${period==='1M'?'active':''}">1M</button><button data-period="3M" class="${period==='3M'?'active':''}">3M</button><button data-period="6M" class="${period==='6M'?'active':''}">6M</button><button data-period="1Y" class="${period==='1Y'?'active':''}">1Y</button></div>
  <div class="card"><div class="stat"><div><div class="stat-label">CARICO NEL TEMPO</div><b>${rows.length?best+' kg':'Nessun dato'}</b></div><span class="link">${rows.length} serie</span></div>
  <div class="chartbox"><svg class="line" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline fill="none" stroke="#13dfc3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/><polyline fill="none" stroke="#168cff55" stroke-width="8" stroke-linecap="round" points="${pts}"/></svg></div>
  <div class="stats-grid" style="margin-top:10px"><div class="metric"><div class="stat-label">VOLUME</div><div class="value">${vol} kg</div><div class="delta">periodo selezionato</div></div><div class="metric"><div class="stat-label">MASSIMO</div><div class="value">${best} kg</div><div class="delta">serie più pesante</div></div></div></div>
  <div class="section-title"><b>Ultime serie</b></div><div class="card">${rows.slice(-6).reverse().map(r=>`<div class="recent"><div class="mini-icon">↗</div><div class="meta"><b>${r.kg} kg × ${r.reps}</b><div class="muted">${r.date} · ${r.rir} RIR</div></div><span class="link">${r.failure?'FAIL':'OK'}</span></div>`).join('')||'<div class="empty">Nessun dato nel periodo selezionato.</div>'}</div>${nav('progress')}`;
  app.querySelector('#ex').onchange=e=>{state.progressEx=e.target.value;renderProgress()};
  app.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{state.progressPeriod=b.dataset.period;renderProgress()});
  bindNav();
}
function renderHistory(){
  let filter=state.historyFilter||'all';

  <div class="stats-grid" style="margin-top:13px"><div class="metric"><div class="stat-label">SESSIONI</div><div class="value">${hist.length}</div></div><div class="metric"><div class="stat-label">SERIE</div><div class="value">${sets}</div></div></div>

  app.querySelector('#back').onclick=renderHome;

function renderExerciseDetail(ex){
  let t=state.type,k=t+'|'+ex,sets=state.draft[k]||[],all=state.history.filter(w=>w.type===t).flatMap(w=>w.sets).filter(s=>s.exercise===ex),last3=all.slice(-3).reverse();

  ${sets.map((z,i)=>`<div class="set-line"><span class="setnum">${i+1}</span><span>${z.kg} kg</span><span>${z.reps}</span><span class="${z.rir===0?'rir0':''}">${z.rir}</span><span class="set-actions"><button class="mini-action" data-edit-set="${i}" aria-label="Modifica serie">✏️</button><button class="mini-action" data-delete-set="${i}" aria-label="Elimina serie">🗑️</button></span></div>${z.note?`<div style="padding:0 10px 8px 49px;font-size:10px;color:#7f9298">📝 ${esc(z.note)}</div>`:''}`).join('')||'<div class="empty">Nessuna serie registrata oggi.</div>'}</div>
  <div class="add-set-panel"><div class="add-set-title"><b>${editing?'✏️ Modifica serie '+(editIndex+1):'+ Aggiungi serie'}</b><span class="check-pill">peso a 0,25 kg</span></div>
  <div class="set-inputs"><input id="kg" class="field" type="number" step="0.25" placeholder="Kg" value="${editing?esc(current.kg):''}"><input id="reps" class="field" type="number" placeholder="Reps" value="${editing?esc(current.reps):''}"><input id="rir" class="field" type="number" placeholder="RIR" value="${editing?esc(current.rir==='-'?'':current.rir):''}"></div>
  <div class="fail-row"><label><input id="fail" type="checkbox" ${editing&&current.failure?'checked':''}> Cedimento</label><span class="muted">RIR 0 = cedimento</span></div>
  <textarea id="note" class="field note-field" placeholder="Note della serie (opzionale)">${editing?esc(current.note||''):''}</textarea>
  <div class="detail-actions"><button id="timer" class="ghost">⏱ Avvia recupero</button><button id="add" class="green">${editing?'✓ Salva modifica':'＋ Registra serie'}</button>${editing?'<button id="cancelEdit" class="ghost">Annulla</button>':''}</div></div>
  <div class="section-title"><b>Ultime registrazioni</b><span class="muted">${all.length} serie</span></div><div class="card">${last3.map((z,i)=>`<div class="recent"><div class="mini-icon">${i+1}</div><div class="meta"><b>${z.kg} kg × ${z.reps}</b><div class="muted">${z.rir} RIR${z.failure?' · Cedimento':''}</div></div></div>`).join('')||'<div class="empty">Ancora nessuna registrazione storica.</div>'}</div>
  <div class="session-footer"><button id="backWorkout" class="primary primary-full">← Torna a ${t}</button></div>`;
  app.innerHTML=h;
  app.querySelector('#back').onclick=()=>{state.editingSet=null;renderWork()};
  app.querySelector('#backWorkout').onclick=()=>{state.editingSet=null;renderWork()};
  app.querySelector('#timer').onclick=renderTimer;
  app.querySelectorAll('[data-edit-set]').forEach(b=>b.onclick=()=>{state.editingSet={key:k,index:Number(b.dataset.editSet)};renderExerciseDetail(ex)});
  app.querySelectorAll('[data-delete-set]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.deleteSet);if(!sets[i])return;sets.splice(i,1);state.editingSet=null;save();renderExerciseDetail(ex)});
  if(app.querySelector('#cancelEdit'))app.querySelector('#cancelEdit').onclick=()=>{state.editingSet=null;renderExerciseDetail(ex)};

    let kg=app.querySelector('#kg').value,reps=app.querySelector('#reps').value;if(!kg||!reps)return;

  };

function renderManage(){let t=state.manageType||'Upper',g=groups(t);app.innerHTML=`<div class="topbar"><button class="iconbtn" id="back">‹</button><h2>Esercizi</h2><button class="iconbtn">＋</button></div><div class="chips" style="margin-top:14px"><button class="active">Tutti</button>${Object.keys(g).slice(0,4).map(x=>`<button>${esc(x)}</button>`).join('')}</div><div class="card"><select id="type" class="field">${['Upper','Lower'].map(x=>`<option ${t===x?'selected':''}>${x}</option>`).join('')}</select><select id="group" class="field" style="margin-top:7px">${Object.keys(g).map(x=>`<option>${esc(x)}</option>`).join('')}</select><input id="new" class="field" placeholder="Nome nuovo esercizio" style="margin-top:7px"><button id="add" class="green primary-full">＋ Aggiungi esercizio</button></div><div class="card">${Object.entries(g).map(([gg,a])=>`<div class="section-title" style="margin-top:3px"><b>${esc(gg)}</b><span class="muted">${a.length}</span></div>${a.map(e=>`<div class="exercise-row"><div class="exercise-art">🏋️</div><div><b>${esc(e)}</b><div class="muted">${t}</div></div><span class="arrow">›</span></div>`).join('')}`).join('')}</div>`;app.querySelector('#back').onclick=renderHome;app.querySelector('#type').onchange=e=>{state.manageType=e.target.value;renderManage()};app.querySelector('#add').onclick=()=>{let tt=app.querySelector('#type').value,gg=app.querySelector('#group').value,n=app.querySelector('#new').value.trim();if(!n)return;(state.custom[tt][gg]||(state.custom[tt][gg]=[])).push(n);save();renderManage()}}
function renderStats(){
  let period=state.statsPeriod||'month';
  let hist=filterHistoryByPeriod(state.history,period);
  let total=hist.length,sets=hist.reduce((q,w)=>q+w.sets.length,0),mus={};
  hist.forEach(w=>w.sets.forEach(s=>{let g=Object.entries(groups(w.type)).find(([gg,ee])=>ee.includes(s.exercise));if(g)mus[g[0]]=(mus[g[0]]||0)+1}));
  let sum=Object.values(mus).reduce((a,b)=>a+b,0)||1,distinct=new Set(hist.flatMap(w=>w.sets.map(s=>s.exercise))).size,upper=hist.filter(w=>w.type==='Upper').length,lower=hist.filter(w=>w.type==='Lower').length;
  app.innerHTML=`<div class="topbar"><button class="iconbtn" id="back">‹</button><div><div class="eyebrow">PANORAMICA</div><h2>Statistiche</h2></div><button class="iconbtn">•••</button></div>
  <div class="seg" style="margin-top:13px"><button data-stat-period="week" class="${period==='week'?'active':''}">Settimana</button><button data-stat-period="month" class="${period==='month'?'active':''}">Mese</button><button data-stat-period="year" class="${period==='year'?'active':''}">Anno</button></div>
  <div class="stats-grid" style="margin-top:12px"><div class="metric"><div class="stat-label">ALLENAMENTI</div><div class="value">${total}</div><div class="delta">${upper} Upper</div></div><div class="metric"><div class="stat-label">VOLUME</div><div class="value">${sets}</div><div class="delta">serie nel periodo</div></div><div class="metric"><div class="stat-label">ESERCIZI</div><div class="value">${distinct}</div><div class="delta">movimenti diversi</div></div><div class="metric"><div class="stat-label">UPPER / LOWER</div><div class="value">${upper} / ${lower}</div><div class="delta">distribuzione sessioni</div></div></div>
  <div class="card" style="margin-top:12px"><div class="stat"><b>Distribuzione muscolare</b><span class="link">${sets} serie</span></div>${Object.entries(mus).sort((a,b)=>b[1]-a[1]).map(([g,v])=>`<div class="barrow"><span>${esc(g)}</span><div class="barbg"><div class="barfill" style="width:${Math.round(v/sum*100)}%"></div></div><span>${Math.round(v/sum*100)}%</span></div>`).join('')||'<div class="empty">Nessun allenamento nel periodo selezionato.</div>'}</div>
  <div class="section-title"><b>Split</b></div><div class="card"><div class="stat"><span>Upper</span><b>${upper} allenamenti</b></div><div class="stat"><span>Lower</span><b>${lower} allenamenti</b></div></div>`;
  app.querySelector('#back').onclick=renderHome;
  app.querySelectorAll('[data-stat-period]').forEach(b=>b.onclick=()=>{state.statsPeriod=b.dataset.statPeriod;renderStats()});

function renderSettings(){app.innerHTML=`<div class="topbar"><button class="iconbtn" id="back">‹</button><div><div class="eyebrow">APP</div><h2>Impostazioni</h2></div><div style="width:43px"></div></div><div class="eyebrow" style="margin-top:22px">ASPETTO</div><div class="card"><div class="settings-row"><span>🌙 Tema</span><span class="muted">Scuro ›</span></div><div class="settings-row"><span>🎨 Colore principale</span><span class="muted">Verde / Blu ›</span></div></div><div class="eyebrow" style="margin-top:22px">DATI</div><div class="card"><div class="settings-row"><span>↥ Esporta dati</span><span>›</span></div><div class="settings-row"><span>↻ Importa dati</span><span>›</span></div></div><div class="eyebrow" style="margin-top:22px">ALTRO</div><div class="card"><div class="settings-row" id="manage"><span>🏋️ Gestisci esercizi</span><span>›</span></div><div class="settings-row" id="history"><span>📚 Storico allenamenti</span><span>›</span></div><div class="settings-row" id="stats"><span>📊 Statistiche</span><span>›</span></div><div class="settings-row danger"><span>🗑 Reset app</span><span>›</span></div></div><div class="notice">Gym Tracker · dati salvati localmente sul dispositivo</div>`;app.querySelector('#back').onclick=renderHome;app.querySelector('#manage').onclick=renderManage;app.querySelector('#history').onclick=renderHistory;app.querySelector('#stats').onclick=renderStats}
function renderMore(){app.innerHTML=`<div class="topbar"><h2>Altro</h2><button class="iconbtn">•••</button></div><div class="card" style="padding:6px"><div class="settings-row" id="manage"><span>🏋️ Gestisci esercizi</span><span>›</span></div><div class="settings-row" id="history"><span>📚 Storico allenamenti</span><span>›</span></div><div class="settings-row" id="stats"><span>📊 Statistiche</span><span>›</span></div><div class="settings-row" id="settings"><span>⚙️ Impostazioni</span><span>›</span></div></div>${nav('more')}`;app.querySelector('#manage').onclick=renderManage;app.querySelector('#history').onclick=renderHistory;app.querySelector('#stats').onclick=renderStats;app.querySelector('#settings').onclick=renderSettings;bindNav()}
function renderActivity(){let k=dateKey(),a=state.activities[k]||{};app.innerHTML=`<div class="topbar"><button class="iconbtn" id="back">‹</button><h2>Attività</h2><div style="width:42px"></div></div><div class="card"><div class="stat"><b>🚶 Passi</b><label><input id="goal" type="checkbox" ${a.goal?'checked':''}> 10k</label></div><input id="steps" class="field" type="number" min="0" step="100" placeholder="Quanti passi?" value="${a.steps||''}" style="margin-top:10px"></div><div class="card"><b>🔥 Cardio extra</b><select id="ct" class="field" style="margin-top:8px"><option value="">Nessun cardio</option>${['Corsa','Tapis roulant','Bici','Ellittica','Camminata','Stairmaster','Altro'].map(x=>`<option ${a.cardioType===x?'selected':''}>${x}</option>`).join('')}</select><div class="grid2" style="margin-top:7px"><input id="mins" class="field" type="number" placeholder="Minuti" value="${a.minutes||''}"><input id="weight" class="field" type="number" step="0.1" placeholder="Peso kg" value="${a.weight||72}"></div><div id="cal" class="notice">Stima: — kcal</div></div><div class="card"><b>📝 Nota</b><textarea id="note" class="field" placeholder="Nota della giornata" style="margin-top:8px">${esc(a.note||'')}</textarea></div><button id="saveact" class="green primary-full">✓ Salva attività</button>`;const $=id=>app.querySelector('#'+id);const calc=()=>{let met={Corsa:9.8,'Tapis roulant':7.5,Bici:7,Ellittica:7,Camminata:3.5,Stairmaster:8,Altro:6}[$('ct').value]||0,w=Number($('weight').value)||72,min=Number($('mins').value)||0,kcal=Math.round(met*w*min/60);$('cal').textContent=$('ct').value&&min?'Stima: ~'+kcal+' kcal':'Stima: — kcal';return kcal};['ct','mins','weight'].forEach(id=>$(id).oninput=calc);calc();$('back').onclick=renderHome;$('saveact').onclick=()=>{state.activities[k]={goal:$('goal').checked,steps:Number($('steps').value)||0,cardioType:$('ct').value,minutes:Number($('mins').value)||0,weight:Number($('weight').value)||72,calories:calc(),note:$('note').value.trim()};save();renderHome()}}
function renderDay(k){let w=state.history.find(x=>x.key===k),a=state.activities[k];let h=`<div class="topbar"><button class="iconbtn" id="back">‹</button><div><div class="eyebrow">DETTAGLIO GIORNO</div><h2>${w?w.type+' · ':''}${nice(k)}</h2></div><div style="width:43px"></div></div>`;if(a)h+=`<div class="detail-hero"><div class="hero-stat"><div><div class="stat-label">ATTIVITÀ</div><div class="number">${Number(a.steps||0).toLocaleString('it-IT')}</div><div class="small">passi</div></div><div class="exercise-icon">🚶</div></div>${a.cardioType?`<div class="legend"><span>🔥 ${esc(a.cardioType)}</span><span>${a.minutes} min</span><span>~${a.calories} kcal</span></div>`:''}</div>`;if(w){let map={};w.sets.forEach(s=>(map[s.exercise]??=[]).push(s));Object.entries(map).forEach(([e,ss])=>{h+=`<div class="card"><div class="stat"><b>${esc(e)}</b><span class="link">${ss.length} serie</span></div>${ss.map((s,i)=>`<div class="recent"><div class="mini-icon">${i+1}</div><div class="meta"><b>${s.kg} kg × ${s.reps}</b><div class="muted">RIR ${s.rir}${s.failure?' · Cedimento':''}</div>${s.note?`<div class="muted" style="margin-top:3px">📝 ${esc(s.note)}</div>`:''}</div></div>`).join('')}</div>`})}if(!w&&!a)h+='<div class="empty">Nessun dato registrato.</div>';app.innerHTML=h;app.querySelector('#back').onclick=renderCalendarPage}

})();
